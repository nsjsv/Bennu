# Bennu 配色模板（schema v2）：深浅各一套，只要底色、文字色、强调色，
# 其余层次由 Bennu 自己算。Bennu 按设置里的深浅模式选用其中一套。
version = 2

[light]
background = "{{ colors.surface.light.hex }}"
text = "{{ colors.on_surface.light.hex }}"
accent = "{{ colors.primary.light.hex }}"

[dark]
background = "{{ colors.surface.dark.hex }}"
text = "{{ colors.on_surface.dark.hex }}"
accent = "{{ colors.primary.dark.hex }}"
