[workspace]
members = [
    "crates/app-ui",
    "crates/bennu-localization",
    "crates/bennu-sidebar",
    "crates/bennu-subprocess",
    "crates/bennu-theme",
    "crates/bennu-preview",
    "crates/desktop-linux",
    "crates/display-renderer",
    "crates/file-core",
    "crates/file-operations",
    "crates/file-search",
    "crates/file-search-daemon",
    "crates/bennu-state",
    "crates/portal-backend",
    "crates/thumbnails",
    "crates/local-send",
]
resolver = "2"

[workspace.package]
version = "0.3.7"
edition = "2021"
license = "GPL-3.0-or-later"
repository = ""
# 应用内部 crate，永不上 crates.io；用 Cargo 原生字段，cargo-release 与
# cargo publish 都会遵守。
publish = false

# 发版用 cargo-release（见 AGENTS.md 发版流程），只在私有仓库改版本号：
# 改 workspace 版本、同步 Cargo.lock、生成 release commit。tag 只在开源库
# 同步后手动打并推送（Release CI 只在开源库触发），所以这里不打 tag、不 push。
[workspace.metadata.release]
push = false
consolidate-commits = true
tag = false
pre-release-commit-message = "chore(release): prepare v{{version}}"

[workspace.dependencies]
blake3 = "1.8.5"
chrono = "0.4.44"
dirs = "5.0"
iced = { version = "0.14", default-features = false, features = ["tokio", "advanced", "advanced-shaping", "canvas", "svg", "image-without-codecs", "x11", "wayland", "fira-sans", "wgpu", "tiny-skia"] }
image = { version = "0.25", default-features = false, features = ["avif-native", "bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
lexopt = "0.3.1"
md-5 = "0.10"
notify = "6.1"
resvg = "0.45.1"
rustix = { version = "1.1.4", features = ["fs"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3.10"
thiserror = "1.0"
time = { version = "0.3.47", features = ["formatting", "macros"] }
tokio = { version = "1.37", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-journald = "0.3"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt"] }
url = "2.5"
zbus = { version = "5.15", features = ["tokio"] }
wl-clipboard-rs = "0.9.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# iced_graphics 0.14.0 的 `align()` 依赖 `set_size` 触发重排，但 cosmic-text
# 0.15 对尺寸未变的 `set_size` 是 no-op，导致 `set_align` 清空的 shaping
# 缓存不会重建，居中多行文本渲染为空（上游 master 已修，见
# iced-rs/iced graphics/src/text.rs）。vendor 补丁与上游一致。
[patch.crates-io]
iced_graphics = { path = "vendor/iced_graphics" }
