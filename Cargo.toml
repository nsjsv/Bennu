[workspace]
members = [
    "crates/app-ui",
    "crates/desktop-linux",
    "crates/file-core",
    "crates/file-search",
    "crates/file-operation-store",
    "crates/thumbnails",
]
resolver = "2"

[workspace.package]
version = "0.2.11"
edition = "2021"
license = "GPL-3.0-or-later"
repository = ""

[workspace.dependencies]
blake3 = "1.8.5"
chrono = "0.4.44"
dirs = "5.0"
iced = { version = "0.14", default-features = false, features = ["tokio", "advanced", "advanced-shaping", "canvas", "svg", "image", "x11", "wayland", "fira-sans", "wgpu"] }
image = { version = "0.25", default-features = false, features = ["avif-native", "bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
lexopt = "0.3.1"
md-5 = "0.10"
notify = "6.1"
resvg = "0.45.1"
rustix = { version = "1.1.4", features = ["fs"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3.10"
thiserror = "1.0"
time = { version = "0.3.47", features = ["formatting", "macros"] }
tokio = { version = "1.37", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
trash = "5.2.6"
tracing = "0.1"
tracing-journald = "0.3"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt"] }
url = "2.5"
zbus = { version = "5.15", features = ["tokio"] }
wl-clipboard-rs = "0.9.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
