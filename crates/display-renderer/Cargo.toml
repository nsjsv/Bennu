[package]
name = "display-renderer"
version.workspace = true
publish.workspace = true
edition = "2021"

# 独立于 desktop-linux 的轻量 crate：portal-backend 与 app-ui 共用的显示
# GPU 检测（sysfs/proc 找卡，Vulkan 问类型），避免 portal 为一个检测函数拖进
# wayland/x11/udisks2 全家桶。wgpu 与 iced 用的是同一份，不多编译。

[dependencies]
wgpu = { version = "27", default-features = false, features = ["std", "vulkan"] }

[dev-dependencies]
tempfile = "3"
