[package]
name = "file-core"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blake3.workspace = true
chardetng = "1.0.0"
chrono.workspace = true
dirs.workspace = true
encoding_rs = "0.8.35"
getrandom = "0.4.2"
filetime = "0.2.29"
image.workspace = true
# 转换时把 JPEG/PNG/WebP 输出里的 EXIF、ICC 补上（容器级读写，不重编码）。
img-parts = "0.4"
# 从各种照片容器（含 HEIC）读 EXIF，并重写成转换后该有的样子。
kamadak-exif = "0.6"
# 大 JPEG 在解码时就缩小（DCT 缩放），image 用的解码器只能解整图；不开 rayon，解码不另开线程池。
jpeg-decoder = { version = "0.3", default-features = false }
libc = "0.2"
md-5.workspace = true
memchr = "2.7"
notify.workspace = true
# 与 image 用的同一版本：超出解码预算的大 PNG 逐行读、边读边缩。
png = "0.18"
regex = "1.12.3"
# 与 image 用的同一版本：要缩小的 TIFF 按条带/图块边读边缩。
tiff = "0.11"
serde = { version = "1", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
sha1.workspace = true
sha2.workspace = true
tracing.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[target.'cfg(unix)'.dependencies]
xattr = "1.6.1"

[target.'cfg(target_os = "linux")'.dependencies]
exacl = "0.13.0"
rustix = { version = "1.1.4", features = ["fs", "mm"] }

[build-dependencies]
# 编 jpeg_rows.c、找系统 libjpeg-turbo（见 build.rs）。
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
# 仅测试用：捕获日志事件，断言退回轮询时有警告。
tracing-subscriber.workspace = true
