[package]
name = "bennu-theme"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bennu-localization = { path = "../bennu-localization" }
# 这里只声明主题/部件编译所需的 iced core、widget 和平台 feature；renderer
# 由宿主选择。继承 workspace 的 wgpu 会让 tiny-skia portal 变成 WGPU fallback。
iced = { version = "0.14", default-features = false, features = [
    "tokio",
    "advanced",
    "advanced-shaping",
    "canvas",
    "svg",
    "image-without-codecs",
    "x11",
    "wayland",
    "fira-sans",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# 与 cosmic-text 用的同一个版本：字体回退按它的文字系统类型划分。
unicode-script = "0.5"
toml = "1.1.2"
# 地址栏认复制来的 `file:///…`：解析、百分号转义交给它。
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
# 只给测试用：编译期查出 vendor 的 cryoglyph 着色器写错（WGSL 平时到运行时才由显卡驱动层编译）。
# 版本与 wgpu 用的那份相同，不多下载、不进程序。
naga = { version = "27", features = ["wgsl-in"] }
# 只给测试用：真实的文字编辑器（空渲染器的编辑器读不出选区），验证只读文字的内容不变量。
# 软件渲染器的并集本来就在 app-ui、portal-backend 里，不进程序、不多下载。
iced = { version = "0.14", default-features = false, features = ["tiny-skia"] }
