[package]
name = "portal-backend"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "bennu-portal"
path = "src/main.rs"

[dependencies]
dark-light = "2.0.0"
dirs.workspace = true
bennu-theme = { path = "../bennu-theme" }
# 侧边栏数据单源（位置/收藏/GTK 书签/config 解析/设备与网络条目模型）
# 与设备/网络挂载平台层：portal 侧边栏与主程序消费同一实现。
bennu-sidebar = { path = "../bennu-sidebar" }
desktop-linux = { path = "../desktop-linux" }
file-core = { path = "../file-core" }
file-operation-store = { path = "../file-operation-store" }
# 共享预览子系统（模型/状态机/面板单源）：portal 是第二个宿主，空格
# 预览的守卫/窗口/回流全走本 crate；其 iced 声明不带渲染器 feature，
# 与本 crate 自行声明的 wgpu+tiny-skia 并集不改变渲染链。
bennu-preview = { path = "../bennu-preview" }
# 渲染链：核显 → 独显 → 软件渲染（iced fallback 按 ICED_BACKEND 候选依次
# 尝试）。wgpu 首选钉住驱动显示器的 GPU（通常为核显且必然已上电；纯 GPU
# 初始化冷首窗实测 ~130ms，独显 NVIDIA 则 ~2.2s，必须避免），GPU 整体不可
# 用时退 tiny-skia（~50ms，兼作滚动卡顿时的兑底选项）。不能沿用 workspace
# 的 iced 定义：它无 wgpu/tiny-skia 的组合控制，feature 只能追加不能削减。
iced = { version = "0.14", default-features = false, features = [
    "tokio",
    "advanced",
    "advanced-shaping",
    "canvas",
    "svg",
    "image-without-codecs",
    "x11",
    "wayland",
    "fira-sans",
    "tiny-skia",
    "wgpu",
] }
display-renderer = { path = "../display-renderer" }
thumbnails = { path = "../thumbnails" }
gio = "=0.22.8"
serde = { version = "1.0.228", features = ["derive"] }
thiserror.workspace = true
tokio.workspace = true
toml = "1.1.2"
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
zbus.workspace = true

[dev-dependencies]
tempfile.workspace = true
