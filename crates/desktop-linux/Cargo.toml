[package]
name = "desktop-linux"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
display-renderer = { path = "../display-renderer" }
smithay-client-toolkit = { version = "=0.19.2", default-features = false, features = ["calloop"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
udisks2 = "0.3.1"
gio = "=0.22.8"
url.workspace = true
wayland-client = { version = "0.31.14", features = ["system"] }
x11rb = "0.13.2"
zbus.workspace = true
wl-clipboard-rs.workspace = true

[dev-dependencies]
tempfile.workspace = true

# 主程序包是整个 workspace 发版的“代表包”：唯一的 tag 在这里打，
# 其余 crate 的 tag 在根 Cargo.toml [workspace.metadata.release] 里关闭。
[package.metadata.release]
tag = true
tag-name = "v{{version}}"
