[package]
name = "app-ui"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ashpd = { version = "0.10.3", default-features = false, features = ["async-std"] }
bennu-localization = { path = "../bennu-localization" }
bennu-preview = { path = "../bennu-preview" }
bennu-sidebar = { path = "../bennu-sidebar" }
bennu-subprocess = { path = "../bennu-subprocess" }
bennu-theme = { path = "../bennu-theme" }
blake3.workspace = true
chrono.workspace = true
dark-light = "2.0.0"
desktop-linux = { path = "../desktop-linux" }
fend-core = "1.5"
file-core = { path = "../file-core" }
file-operations = { path = "../file-operations" }
file-search = { path = "../file-search" }
hashbrown = { version = "0.16", default-features = false, features = ["default-hasher"] }
bennu-state = { path = "../bennu-state" }
iced.workspace = true
image.workspace = true
libc = "0.2"
lexopt.workspace = true
local-send = { path = "../local-send" }
parking_lot = "0.12"
regex = "1.12.3"
resvg.workspace = true
rustix = { workspace = true, features = ["event", "process", "stdio", "termios"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json.workspace = true
thumbnails = { path = "../thumbnails" }
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml = "1.1.2"
toml_edit = "0.25.11"
tracing.workspace = true
# 输入框的光标位置按字素数：重命名先选中主名要按同一种数法。
unicode-segmentation = "1.13.2"
url.workspace = true
tracing-journald.workspace = true
tracing-subscriber.workspace = true
alacritty_terminal = "0.26.0"
portable-pty = "0.9.0"

[dev-dependencies]
chrono-tz = "0.10.4"
file-operations = { path = "../file-operations", features = ["test-support"] }
iced_runtime = "0.14"
rusqlite = { version = "0.32.1", features = ["bundled"] }
